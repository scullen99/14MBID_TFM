AWSTemplateFormatVersion: "2010-09-09"
Description: "AWS Glue Python Shell Job with permissions for Data Consumption in the Gold Layer"

Resources:
  ## IAM Role para el Glue Job (Consumption)
  GlueJobExecutionRoleConsumption:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "GlueJobExecutionRoleConsumption"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: GlueJobS3AccessPolicyGold
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Permiso de lectura en el bucket Silver
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:ListBucket"
                  - "s3:HeadObject"
                Resource:
                  - !Sub "arn:aws:s3:::datalake-silver-transformation-${AWS::Region}-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::datalake-silver-transformation-${AWS::Region}-${AWS::AccountId}/*"

              # Permiso de escritura en el bucket Gold
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:ListBucket"
                  - "s3:HeadObject"
                  - "s3:PutObject"
                Resource:
                  - !Sub "arn:aws:s3:::datalake-gold-consumption-${AWS::Region}-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::datalake-gold-consumption-${AWS::Region}-${AWS::AccountId}/*"

              # Permiso de lectura en el bucket de recursos (para cargar configuraciones)
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:ListBucket"
                  - "s3:HeadObject"
                Resource:
                  - !Sub "arn:aws:s3:::datalake-resources-storage-${AWS::Region}-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::datalake-resources-storage-${AWS::Region}-${AWS::AccountId}/jsons/*"

              # Permiso de escritura en el bucket de logs
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                Resource:
                  - !Sub "arn:aws:s3:::datalake-logs-storage-${AWS::Region}-${AWS::AccountId}/*"

              # Permiso para leer el script de Glue desde S3
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:ListBucket"
                  - "s3:HeadObject"
                Resource:
                  - !Sub "arn:aws:s3:::datalake-resources-storage-${AWS::Region}-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::datalake-resources-storage-${AWS::Region}-${AWS::AccountId}/python_glue_scripts/*"

              # Permiso para escribir logs en CloudWatch
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"

              # Permiso para acceder a Secrets Manager (obtener nombres de buckets)
              - Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:DescribeSecret"
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*"

      Tags:
        - Key: "Environment"
          Value: "Production"
        - Key: "Service"
          Value: "Glue"
        - Key: "Component"
          Value: "Consumption"
        - Key: "Layer"
          Value: "Gold"

  ## Glue Job (Consumption)
  GlueJobConsumption:
    Type: AWS::Glue::Job
    Properties:
      Name: "datalake-glue-job-consumption"
      Role: !GetAtt GlueJobExecutionRoleConsumption.Arn
      GlueVersion: "5.0"
      Command:
        Name: "pythonshell"
        ScriptLocation: !Sub "s3://datalake-resources-storage-${AWS::Region}-${AWS::AccountId}/python_glue_scripts/consumption_glue_job.py"
        PythonVersion: "3.9"
      DefaultArguments:
        "--TempDir": !Sub "s3://datalake-resources-storage-${AWS::Region}-${AWS::AccountId}/glue_job_logs/"
        "--enable-metrics": "true"
        "--job-language": "python"
      MaxCapacity: 1.0
      Timeout: 60
      MaxRetries: 0
      Tags:
        Environment: "Production"
        Service: "Glue"
        Component: "Consumption"
        Layer: "Gold"

Outputs:
  GlueJobName:
    Description: "Name of the AWS Glue Job (Consumption)"
    Value: !Ref GlueJobConsumption

  GlueJobRoleArn:
    Description: "ARN of the IAM Role for the Glue Job (Consumption)"
    Value: !GetAtt GlueJobExecutionRoleConsumption.Arn