AWSTemplateFormatVersion: "2010-09-09"
Description: "Lambda to send AWS Glue Crawler notifications to Slack from S3 script"

Resources:
  GlueCrawlerNotificationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GlueCrawlerNotification
      Runtime: python3.9
      Handler: notify_crawler_status.lambda_handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt GlueCrawlerLambdaExecutionRole.Arn
      Environment:
        Variables:
          SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/*****/*****/*****"
      Code:
        S3Bucket: !Sub "datalake-resources-storage-${AWS::Region}-${AWS::AccountId}"
        S3Key: "python_glue_scripts/notify_crawler_status.zip"
      Tags:
        - Key: Project
          Value: DataLake
        - Key: Owner
          Value: DevOpsTeam
        - Key: Environment
          Value: Production
        - Key: Service
          Value: GlueCrawlerNotification

  GlueCrawlerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GlueCrawlerLambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GlueCrawlerNotificationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                Resource: !Sub "arn:aws:s3:::datalake-resources-storage-${AWS::Region}-${AWS::AccountId}/python_glue_scripts/*"
              - Effect: Allow
                Action:
                  - "sns:Publish"
                Resource:
                  - !Ref GlueCrawlerNotificationSuccess
                  - !Ref GlueCrawlerNotificationFailure

  GlueCrawlerNotificationSuccess:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: GlueCrawlerNotificationSuccess
      Tags:
        - Key: Project
          Value: DataLake
        - Key: Environment
          Value: Production

  GlueCrawlerNotificationFailure:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: GlueCrawlerNotificationFailure
      Tags:
        - Key: Project
          Value: DataLake
        - Key: Environment
          Value: Production

  LambdaTestEvent:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref GlueCrawlerNotificationLambda
      Qualifier: "$LATEST"
      MaximumRetryAttempts: 0
      DestinationConfig:
        OnSuccess:
          Destination: !Ref GlueCrawlerNotificationSuccess
        OnFailure:
          Destination: !Ref GlueCrawlerNotificationFailure

Outputs:
  LambdaFunctionARN:
    Description: "ARN of the Lambda function"
    Value: !GetAtt GlueCrawlerNotificationLambda.Arn