AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 Bucket for storing AWS Glue, Lambda job scripts, JSON, YAML files and other resources"

Resources:
  ResourcesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: 
        !Sub "datalake-resources-storage-${AWS::Region}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpirationRule
            Status: Enabled
            ExpirationInDays: 180
          - Id: InfrequentAccessRule
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: "Environment"
          Value: "Production"
        - Key: "Purpose"
          Value: "Glue-Lambda-Scripts-JSON-YAML"

Outputs:
  ResourcesBucketName:
    Description: "Name of the S3 bucket for AWS Glue, Lambda job scripts, JSON, YAML files, and other resources"
    Value: !Ref ResourcesBucket