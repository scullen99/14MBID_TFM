AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 Bucket for Silver layer transformation in the Data Lake (Transformation)"

Resources:
  SilverTransformationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: 
        !Sub "datalake-silver-transformation-${AWS::Region}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpirationRule
            Status: Enabled
            ExpirationInDays: 365
          - Id: InfrequentAccessRule
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: "Environment"
          Value: "Production"
        - Key: "Layer"
          Value: "Silver"
        - Key: "Purpose"
          Value: "Data Transformation"
        - Key: "Component"
          Value: "Processing"

Outputs:
  SilverTransformationBucketName:
    Description: "Name of the Silver layer transformation bucket"
    Value: !Ref SilverTransformationBucket
    Export:
      Name: SilverTransformationBucketName